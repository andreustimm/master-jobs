# Contrato, retomada e commit de release: docs/engineering/promotion.md.
name: Promover para staging

on:
  # Dispara quando o CI de push em dev termina (decisão do dono, 26/09/2026,
  # #347): o que entra em dev chega a staging sem esperar janela. Entre 23/09
  # e 26/09 (#263) o gatilho foi só o agendado, para poupar o limite diário de
  # deploys da Vercel (100/dia): cada promoção gera deploy de staging e um
  # `chore(release)` em dev. O custo volta, mitigado por três cortes: o
  # `ignoreCommand` da #259 pula deploy sem efeito no site; um evento cujo SHA
  # já não é a ponta de dev termina em skip (só a ponta mais nova promove); e
  # o evento que chega depois de staging já conter o SHA também — é o que
  # encerra o ciclo do `chore(release)`, cujo push pode disparar CI e voltar
  # aqui. `failure` entra porque um run vermelho só por job de
  # NON_BLOCKING_CI_JOBS promove; o veredito por job decide, e o resto é skip.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]
  # Rede de segurança: pega um evento perdido. Com staging já na ponta de dev,
  # termina em skip, sem CI e sem release. 15:00 e 21:00 UTC = 12:00 e 18:00 BRT.
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      target-sha:
        description: SHA completo de dev cujo CI deve autorizar esta promoção.
        required: true
        type: string
      confirmar-migracao:
        description: Confirma revisão humana de migração NÃO aditiva entre staging e o SHA escolhido (aditiva dispensa).
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Também usado pelo retorno main → dev. A validação inteira faz parte da fila.
concurrency:
  group: release-versionar
  queue: max
  cancel-in-progress: false

jobs:
  preparar:
    # Do CI, só run de push concluído com veredito possível; o controlador
    # confere branch, evento e conclusão de novo.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.alvo.outputs.source }}
      target: ${{ steps.alvo.outputs.target }}
      skip: ${{ steps.alvo.outputs.skip }}
    steps:
      # O controlador vem da revisão do workflow, nunca do checkout candidato.
      - uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: control/package.json
      - name: Fixar entrada, conferir CI e preparar release
        id: alvo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: node control/scripts/release/promotion.ts prepare candidate

  validar:
    needs: preparar
    # Automático sem nada a promover (staging já contém A, A deixou de ser a
    # ponta, CI vermelho): sem CI e sem publicação.
    if: needs.preparar.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      target-sha: ${{ needs.preparar.outputs.target }}

  promover:
    needs: [preparar, validar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # Só para disparar o CI na cabeça da PR de produção (último passo).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: control/package.json
      - name: Publicar somente o SHA validado
        id: promocao
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          PROMOTION_SOURCE: ${{ needs.preparar.outputs.source }}
          PROMOTION_TARGET: ${{ needs.preparar.outputs.target }}
          VALIDATED_SHA: ${{ needs.validar.outputs.validated-sha }}
        run: node control/scripts/release/promotion.ts complete candidate

      - name: Abrir a PR staging → main
        if: steps.promocao.outputs.promoted == 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          SOURCE_SHA: ${{ needs.preparar.outputs.source }}
          TARGET_SHA: ${{ needs.preparar.outputs.target }}
        run: |
          ABERTA=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // ""')
          if [ -z "$ABERTA" ]; then
            git fetch origin main staging --quiet
            if [ "$(git rev-list --count origin/main..origin/staging)" = "0" ]; then
              echo "::notice::staging não tem commit além de main; nenhuma PR de produção a abrir."
              exit 0
            fi
          fi
          VERSAO=$(git show "$TARGET_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          SUBSTITUIDO=$(git show -s --format='%(trailers:key=Promotion-Supersedes,valueonly)' "$TARGET_SHA")
          cat > "$RUNNER_TEMP/promotion-pr.md" <<EOF
          Promoção de dev para staging. Esta PR **não** é mesclada por robô.

          <!-- promotion-provenance:start -->
          Entrada com CI aprovado: $SOURCE_SHA. Alvo validado pelo CI reutilizável: $TARGET_SHA.
          Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.
          Candidato pendente substituído nesta preparação: ${SUBSTITUIDO:-nenhum}.
          <!-- promotion-provenance:end -->

          Antes de mesclar, confira:
          - [ ] Changelogs técnico e bilíngues e versão de package.json.
          - [ ] QA full do release candidate conforme docs/qa/README.md.
          - [ ] Migração revisada e procedimento de deploy cumprido, se aplicável.

          Após o merge humano, sincronizar-apos-main.yml preserva a tag, cria as GitHub Releases ausentes e devolve main para dev.
          EOF
          if [ -n "$ABERTA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$ABERTA" --jq '.body // ""' > "$RUNNER_TEMP/promotion-pr-previous.md"
            node ../control/scripts/release/promotion-pr.ts "$RUNNER_TEMP/promotion-pr-previous.md" "$RUNNER_TEMP/promotion-pr.md"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$ABERTA" \
              -f "title=chore(release): Promover staging para produção — v${VERSAO}" \
              -F "body=@$RUNNER_TEMP/promotion-pr.md" --silent
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ABERTA/assignees" -f 'assignees[]=andreustimm' --silent
            echo "::notice::Proveniência da PR #$ABERTA atualizada."
            exit 0
          fi
          gh pr create --base main --head staging \
            --assignee andreustimm \
            --title "chore(release): Promover staging para produção — v${VERSAO}" \
            --body-file "$RUNNER_TEMP/promotion-pr.md"

      # A PR aberta pelo robô nasce com o CI de `pull_request` parado em
      # `action_required` (ver o passo seguinte), e o fast-forward de staging
      # pelo `GITHUB_TOKEN` não dispara nada: sem este passo os
      # checks exigidos em `main` nunca apareciam na cabeça e o dono tinha de
      # fechar e reabrir a PR. `github.token` de propósito — dispatch é a única
      # coisa que ele consegue disparar, e basta.
      - name: Rodar o CI na cabeça da PR de produção
        if: steps.promocao.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ABERTA=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head staging --state open --json number --jq '.[0].number // ""')
          if [ -z "$ABERTA" ]; then
            echo "::notice::Nenhuma PR staging → main aberta; CI não disparado."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref staging
          echo "::notice::CI disparado em staging para a PR #$ABERTA."

      # O dispatch acima publica os checks no SHA, mas na v1.25.0 (#303) o
      # ruleset de `main` continuou dizendo "expected" por 11 minutos com
      # `qualidade` e `schema-e-migracao` verdes nele. O que destravou foi o run
      # de `pull_request` da própria PR — que o GitHub cria para PR do robô, mas
      # parado em `action_required`, à espera de aprovação, como PR de
      # contribuidor de primeira viagem. Fechar e reabrir era a aprovação por
      # outra porta; aqui ela é pedida pela API. Só runs deste repositório, no
      # SHA da cabeça da PR: é o código que a promoção acabou de validar.
      # Falhar em aprovar não reprova a promoção — o recurso manual continua
      # (docs/engineering/github-protections.md#o-caminho-humano).
      - name: Aprovar o CI de pull_request da PR de produção
        if: steps.promocao.outputs.promoted == 'true'
        # Uma leitura do `gh` que falhe (5xx, limite) também não pode pintar de
        # vermelho uma promoção que já publicou `staging`.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head staging --state open --json number,headRefOid --jq '.[0] // empty | "\(.number) \(.headRefOid)"')
          if [ -z "$PR" ]; then
            echo "::notice::Nenhuma PR staging → main aberta; nada a aprovar."
            exit 0
          fi
          read -r NUMERO CABECA <<< "$PR"
          # O run nasce alguns segundos depois da PR; sem espera, a consulta
          # feita logo após abri-la não o encontraria. TENTATIVAS_APROVACAO e
          # ESPERA_APROVACAO só existem para o teste rodar o passo sem dormir.
          PENDENTES=""
          for _ in $(seq "${TENTATIVAS_APROVACAO:-6}"); do
            PENDENTES=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=action_required&head_sha=$CABECA&per_page=20" \
              --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id")
            [ -n "$PENDENTES" ] && break
            sleep "${ESPERA_APROVACAO:-10}"
          done
          if [ -z "$PENDENTES" ]; then
            echo "::notice::Nenhum run da PR #$NUMERO aguardando aprovação."
            exit 0
          fi
          for RUN in $PENDENTES; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve" --silent; then
              echo "::notice::Run $RUN da PR #$NUMERO aprovado."
            else
              echo "::warning::Run $RUN da PR #$NUMERO não foi aprovado pela API; aprove na aba Actions ou feche e reabra a PR."
            fi
          done
