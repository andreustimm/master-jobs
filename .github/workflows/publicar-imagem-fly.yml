# Plano B de deploy (Fase 4 da #351, ADR 0030). SÓ `workflow_dispatch` —
# nenhum push, PR ou agendamento aciona isto. Mesmo manual, só publica o que
# está em `main` (o `if` do job `publicar` trava o ref): quem dispara escolhe
# QUANDO, nunca a partir de qual código — o mesmo espírito de `migrate.yml`
# ("Produção única"). A Vercel continua o destino padrão; este workflow
# existe para o dono publicar a imagem standalone no GHCR e, se decidir,
# implantá-la no Fly.io (região `gru`) durante um failover. Ver
# docs/engineering/deploy.md ("Plano B: Fly.io").
name: Publicar imagem (plano B Fly.io)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Também implantar no Fly.io depois de publicar a imagem?
        type: boolean
        default: false
      tag:
        description: "Tag da imagem (padrão: o SHA curto do commit); só [a-zA-Z0-9._-]"
        required: false
        type: string

# Permissões mínimas por job (abaixo), não no topo: `packages: write` só onde
# a imagem é publicada, nunca no job que implanta no Fly.
permissions:
  contents: read

# Uma publicação por vez; a segunda espera a primeira terminar, nunca cancela
# um push de imagem no meio.
concurrency:
  group: publicar-imagem-fly
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  publicar:
    # Só publica a partir de `main`, mesmo disparado à mão de outra branch no
    # seletor do GitHub — a imagem do plano B nunca deveria ser uma branch de
    # tarefa não revisada.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolver e validar a tag
        id: tag
        env:
          TAG_ENTRADA: ${{ inputs.tag }}
        run: |
          tag="$TAG_ENTRADA"
          if [ -z "$tag" ]; then tag="${GITHUB_SHA:0:7}"; fi
          if ! [[ "$tag" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "tag inválida (\"$tag\"): só [a-zA-Z0-9._-]" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Constrói e CARREGA no daemon local (`load: true`, `push: false`) —
      # nada vai ao GHCR ainda. A inspeção abaixo roda sobre esta imagem, e só
      # depois dela passar é que o login e o push acontecem.
      - name: Build local da imagem (ainda sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGEM }}:latest

      # MAJOR M2 (revisão da #373): inspeciona o sistema de arquivos de
      # verdade, não só os metadados do `docker history` — um segredo COPIADO
      # (e depois apagado numa camada seguinte) ainda aparece no `history`,
      # mas só um `docker run`/`find` sobre o filesystem final o pega. Roda
      # ANTES de qualquer login ou push: nada sensível sai do runner se a
      # inspeção reprovar.
      - name: Inspecionar o sistema de arquivos da imagem ANTES de publicar
        run: |
          set -e
          IMG="${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}"
          achou=0

          # --user 0: a imagem roda como `nextjs` (uid 1101) por padrão, e
          # esse usuário não lê `/root` nem outros caminhos só-root — uma
          # inspeção sem privilégio deixaria passar segredo escondido
          # exatamente onde só root enxerga. A imagem publicada continua sem
          # `USER root` nenhum; isto só afeta o processo do `find`/`grep`
          # desta checagem, nunca o `CMD` de verdade.
          if docker run --rm --user 0 --entrypoint find "$IMG" / -xdev \
              \( -path /proc -o -path /sys \) -prune -o \
              \( -name '.env' -o -name '.env.*' -o -name '*.token.json' \
                 -o -name '.linkedin-session.json' -o -name '*.db' \) -print \
              2>/dev/null | grep -q .; then
            echo "Arquivo sensível encontrado no sistema de arquivos da imagem." >&2
            achou=1
          fi

          if docker run --rm --user 0 --entrypoint sh "$IMG" -c \
              "grep -rIlE 'DATABASE_URL=postgres|_API_KEY=[^\$]|_AUTH_TOKEN=[^\$]|READ_WRITE_TOKEN=[^\$]' / \
                --exclude-dir=proc --exclude-dir=sys 2>/dev/null" \
              | grep -q .; then
            echo "Valor com formato de segredo encontrado no sistema de arquivos da imagem." >&2
            achou=1
          fi

          if [ "$achou" -ne 0 ]; then exit 1; fi

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem já inspecionada
        run: |
          docker push "${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}"
          docker push "${{ env.IMAGEM }}:latest"

      # Regra 16, segunda linha: sobre a imagem publicada de verdade, e não só
      # a que ficou no daemon local — confere que o registro devolve a mesma
      # coisa que foi inspecionada.
      - name: Confirmar, na imagem publicada, que nenhuma camada carrega segredo
        run: |
          docker pull "${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}"
          docker history --no-trunc "${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}" > /tmp/history.txt
          if grep -Eiq 'DATABASE_URL=postgres|_API_KEY=[^$]|_AUTH_TOKEN=[^$]|READ_WRITE_TOKEN=[^$]' /tmp/history.txt; then
            echo "Valor com formato de segredo encontrado no histórico da imagem." >&2
            exit 1
          fi

  implantar:
    needs: publicar
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # `environment: production` exige a aprovação/segredo cadastrados nesse
    # ambiente do repositório (`FLY_API_TOKEN`, passo do dono) — o mesmo
    # padrão de `migrate.yml`.
    environment: production
    steps:
      - uses: actions/checkout@v7
      # Pinado pelo SHA que as tags `1.6` e `v1` apontam (checado em
      # 29/09/2026, `gh api repos/superfly/flyctl-actions/tags`) — nunca
      # `@master`, que é um branch flutuante e correria código não revisado
      # neste ponto do pipeline.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Implantar a imagem publicada no Fly.io (gru)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy --config fly.toml --remote-only
          --image "${{ env.IMAGEM }}:${{ needs.publicar.outputs.tag }}"
