# Plano B de deploy (Fase 4 da #351, ADR 0030). SÓ `workflow_dispatch` —
# nenhum push, PR ou agendamento aciona isto. A Vercel continua o destino
# padrão; este workflow existe para o dono publicar a imagem standalone no
# GHCR e, se decidir, implantá-la no Fly.io (região `gru`) durante um
# failover. Ver docs/engineering/deploy.md ("Plano B (Fly.io)").
name: Publicar imagem (plano B Fly.io)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Também implantar no Fly.io depois de publicar a imagem?
        type: boolean
        default: false
      tag:
        description: "Tag da imagem (padrão: o SHA curto do commit disparado)"
        required: false
        type: string

# Permissões mínimas: ler o checkout e escrever no GHCR. Nada de escrita em
# variável de repositório, issue ou pull request neste workflow.
permissions:
  contents: read
  packages: write

# Uma publicação por vez; a segunda espera a primeira terminar, nunca cancela
# um push de imagem no meio.
concurrency:
  group: publicar-imagem-fly
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolver a tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_SHA:0:7}"; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem standalone
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGEM }}:latest

      # Regra 16: nenhum valor de variável de produção pode ter entrado numa
      # camada, mesmo que `.dockerignore` já devesse ter impedido o contexto
      # de carregá-lo. Segunda linha, sobre a imagem publicada de verdade.
      - name: Confirmar que nenhum segredo entrou numa camada
        run: |
          docker pull "${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}"
          docker history --no-trunc "${{ env.IMAGEM }}:${{ steps.tag.outputs.value }}" > /tmp/history.txt
          if grep -Eiq 'DATABASE_URL=postgres|_API_KEY=[^$]|_AUTH_TOKEN=[^$]|READ_WRITE_TOKEN=[^$]' /tmp/history.txt; then
            echo "Valor com formato de segredo encontrado no histórico da imagem." >&2
            exit 1
          fi

  implantar:
    needs: publicar
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` exige a aprovação/segredo cadastrados nesse
    # ambiente do repositório — o mesmo padrão de `migrate.yml`.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Implantar a imagem publicada no Fly.io (gru)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy --config fly.toml --remote-only
          --image "${{ env.IMAGEM }}:${{ needs.publicar.outputs.tag }}"
