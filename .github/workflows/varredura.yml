# A varredura de vagas no GitHub Actions: rede de segurança da varredura horária.
#
# ## Quem varre de verdade
#
# Desde a ADR 0025, a varredura roda na Vercel, em fatias de menos de 25
# segundos: o `pg_cron` do Supabase chama `/api/cron/varredura?fatia=…` a cada
# poucos minutos (SQL em `supabase/cron/varredura.sql`). A função roda em `gru1`,
# ao lado do banco; este runner fica nos EUA e pagava uma ida e volta por
# consulta — foram ~57 minutos por execução em 23/09/2026.
#
# ## O que sobra para este arquivo
#
# - **Até a troca de agendador**, a execução diária continua como sempre: o
#   agendamento no Supabase é passo humano (runbook em `docs/operations.md`), e
#   desligar isto antes dele deixaria o acervo sem varredura nenhuma.
# - **Depois da troca**, o dono define a variável de repositório
#   `VARREDURA_AGENDADOR=supabase` e o disparo agendado deste workflow passa a
#   não fazer nada. Um agendador por vez: dois sobre a mesma fila dobravam as
#   requisições a sites de terceiros sem que um soubesse do outro (B-11, #269).
# - **Sempre**, o disparo manual (`workflow_dispatch`) continua valendo — é o
#   que a tela de operações pede, e é o caminho de volta se a Vercel parar.
#
# ## Só produção
#
# `dev` e `staging` existem para exercitar código, não para acumular acervo. Uma
# varredura em três bancos triplicaria as requisições contra as APIs de terceiros
# para produzir dois acervos que ninguém lê.
name: Varredura de vagas

on:
  schedule:
    # 06:00 UTC = 03:00 em São Paulo. Fora do horário comercial de quem hospeda
    # as vagas, e o resultado está pronto quando o dia começa aqui.
    - cron: "0 6 * * *"
  # Para rodar à mão depois de mexer em `config/sources.yaml`, sem esperar o dia,
  # e para a tela de operações do administrador pedir uma fatia só.
  #
  # O padrão é `tudo`, que é o que a cron faz: um disparo sem escolha não pode
  # significar menos do que a execução automática significa.
  workflow_dispatch:
    inputs:
      rotina:
        description: "O que rodar"
        required: false
        default: tudo
        type: choice
        # `execucao` é o pedido da tela de Plataformas (#223): roda só a
        # execução de `source_run` indicada abaixo, e nenhum passo da varredura
        # inteira casa com ela.
        options: [tudo, sync, termos, recheck, rescore, execucao]
      acao:
        description: "Com rotina=execucao: sync (captura) ou recheck (verificação)"
        required: false
        default: sync
        type: choice
        options: [sync, recheck]
      execucao:
        description: "Com rotina=execucao: id da execução em source_run"
        required: false
        default: ""
        type: string
      fonte:
        description: "Com rotina=execucao: kind:handle da fonte, conferido contra a execução"
        required: false
        default: ""
        type: string

# Duas varreduras simultâneas dobrariam a carga contra as APIs de terceiros e
# disputariam as mesmas linhas da fila de captura. `cancel-in-progress: false`
# porque varredura começada deve terminar: cancelar no meio deixa tarefas com
# claim pendurado, e elas só voltam a ser elegíveis depois do timeout.
concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    # Opt-in somente depois de definir retenção/orçamento. A migração seletiva
    # não autoriza recarregar automaticamente todo o corpus no plano Free.
    #
    # A terceira condição é a troca de agendador (ADR 0025): com
    # `VARREDURA_AGENDADOR=supabase`, só o disparo manual executa.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.SUPABASE_CRAWL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.VARREDURA_AGENDADOR != 'supabase')
    environment: production
    runs-on: ubuntu-latest
    # Generoso mas limitado. O runner fica nos EUA e o banco em São Paulo, e a
    # 1.15.0 mostrou o que isso custa: com uma consulta por vaga, o sync sozinho
    # passou de uma hora e a execução foi cancelada antes de buscar os termos e
    # pontuar. O sync tem teto próprio abaixo; este é o de segurança.
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_CA_CERT: config/certs/supabase-ca.crt
      # A política de ingestão (ADR 0021) nega por omissão: sem declarar o
      # ambiente, este job normalizaria para `preview` e seria bloqueado. A
      # allowlist é a segunda metade — produção só gasta cota das fontes que
      # alguém listou de propósito, e listar é decisão de operação, não de CI.
      JHO_ENV: production
      JHO_SOURCE_ALLOWLIST: ${{ vars.JHO_SOURCE_ALLOWLIST }}
      # Das 15 fontes ativas, nenhuma exige Adzuna. Se ele for habilitado sem
      # credenciais, é ignorado com aviso; as outras fontes seguem.
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # Identifica o tráfego como este projeto. Sem isto sairia o padrão do
      # `undici`, e quem hospeda a vaga não teria como saber quem está lendo.
      JHO_USER_AGENT: master-jobs/0.1 (+https://jobs.mastertimm.com.br)

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: O segredo existe?
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DATABASE_URL ausente. Nenhuma varredura executada."
            exit 1
          fi
          if [ -z "$JHO_SOURCE_ALLOWLIST" ]; then
            echo "::error::JHO_SOURCE_ALLOWLIST ausente. A política de ingestão exige a lista declarada; nenhuma varredura executada."
            exit 1
          fi

      # 0. O pedido da tela de Plataformas (#223): uma execução de `source_run`
      #    já criada e `queued`. Os insumos entram por variável de ambiente,
      #    nunca interpolados no script, e a CLI valida os dois (id inteiro, e
      #    a fonte precisa ser a da execução). Nenhum passo abaixo casa com a
      #    rotina `execucao`. O grupo `varredura` guarda um pendente só e
      #    cancela o mais velho: a execução daquele disparo fica `queued`, e o
      #    próximo pedido equivalente a despacha de novo (`shouldRedispatch`).
      - name: Executar o pedido da tela
        if: github.event_name == 'workflow_dispatch' && inputs.rotina == 'execucao'
        env:
          ACAO: ${{ inputs.acao }}
          EXECUCAO: ${{ inputs.execucao }}
          FONTE: ${{ inputs.fonte }}
        run: |
          if [ "$ACAO" = "recheck" ]; then
            pnpm jho jobs verify --run "$EXECUCAO" --limit 1000 ${FONTE:+--source "$FONTE"}
          else
            pnpm jho jobs sync --run "$EXECUCAO" ${FONTE:+--source "$FONTE"}
          fi

      # 1. Buscar. `sync` já pontua ao final; `--no-score` existiria para pular.
      #
      #    Teto próprio e `continue-on-error`: um sync que não termina não pode
      #    levar junto os termos, a captura e a nota do dia, que dependem só do
      #    que já está no banco. Cada fonte grava ao terminar, então o que foi
      #    sincronizado até o corte fica. O alarme vermelho sai no último passo.
      - name: Sincronizar as fontes
        id: sync
        continue-on-error: true
        timeout-minutes: 45
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'sync'
        run: pnpm jho jobs sync

      # 1b. Repetir as buscas por termo salvas. Depois do sync, que já gastou a
      #     sua parte da cota de cada plataforma, e antes da repontuação, que dá
      #     nota às vagas que as buscas trouxeram. O log só tem agregados por
      #     plataforma. Se TODAS as plataformas falharem, o resto da varredura
      #     segue — captura, reconferência e nota não dependem dos termos — e o
      #     alarme vermelho sai no último passo.
      - name: Buscar os termos salvos
        id: termos
        continue-on-error: true
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'termos'
        run: pnpm jho terms run

      # 2. Capturar a descrição das que valem a pena. O corte de fit evita gastar
      #    requisição com vaga que não seria lida de todo jeito.
      - name: Enfileirar captura
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'termos'
        run: pnpm jho scrape queue --min-fit 45

      - name: Capturar
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'termos'
        run: pnpm jho scrape run --limit 300

      # 3. Reconferir se o que já está no banco continua aberto. Depois da troca
      #    de agendador, quem reconfere é a fatia `reconferencia` do `pg_cron`,
      #    e este passo só roda por disparo manual — um teste trava que nunca
      #    haja dois agendadores ativos ao mesmo tempo.
      - name: Enfileirar reconferência
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'recheck'
        run: pnpm jho jobs recheck queue

      - name: Reconferir
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'recheck'
        run: pnpm jho jobs recheck run --max 400

      # 4. Repontuar quem pediu.
      #
      # A fila é alimentada por evento: salvar um currículo enfileira, porque é
      # dele que sai o perfil de matching e do perfil sai a nota de cada vaga.
      # Recalcular dentro do pedido não cabe — são milhares de gravações, e quem
      # acabou de colar o CV ficaria olhando um formulário travado.
      #
      # Aqui a fila é drenada de vez. Quem não quiser esperar até amanhã tem
      # `jho jobs rescore run` na mão.
      - name: Repontuar a fila
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'rescore'
        run: pnpm jho jobs rescore run

      # 5. E garantir que ninguém ficou para trás.
      #
      # Vaga nova entrou no passo 1, e a nota dela não existe para candidato
      # nenhum até alguém pontuar. Sem isto, o acervo cresceria e só quem
      # salvasse um currículo veria as vagas do dia.
      - name: Pontuar as vagas novas
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.rotina == 'tudo' ||
          inputs.rotina == 'rescore'
        run: pnpm jho jobs score --every-candidate

      # 4. Olhar para as fontes.
      #
      # `syncAll` NÃO aborta quando uma fonte quebra — é a decisão certa, porque
      # uma API fora do ar não pode zerar a varredura inteira. O efeito colateral
      # é que a falha fica silenciosa até alguém rodar `sources list` e reparar.
      # Aqui o CI repara por conta própria.
      - name: Conferir o estado das fontes
        if: always()
        run: |
          SAIDA=$(pnpm jho sources list 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "$SAIDA"

          TOTAL=$(echo "$SAIDA" | grep -cE "  (ok|error|never)$" || true)
          QUEBRADAS=$(echo "$SAIDA" | grep -cE "  error$" || true)
          echo "$QUEBRADAS de $TOTAL fonte(s) com erro."

          if [ "$QUEBRADAS" -eq 0 ]; then
            exit 0
          fi

          # Uma fonte fora do ar é rotina e não merece um alarme vermelho por
          # dia. Metade delas fora significa que o problema é aqui — rede do
          # runner, user-agent bloqueado, dependência quebrada — e aí o alarme
          # é o ponto.
          if [ "$((QUEBRADAS * 2))" -gt "$TOTAL" ]; then
            echo "::error::Mais da metade das fontes falhou. Provável causa comum."
            exit 1
          fi
          echo "::warning::$QUEBRADAS fonte(s) com erro. Veja o detalhe acima."

      - name: Resumo do acervo
        if: always()
        # Fecha o log com o número que interessa a quem abrir a execução para
        # saber se valeu a pena: quantas vagas existem e quantas estão abertas.
        run: pnpm jho stats

      - name: Conferir o sync
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "::error::O sync das fontes falhou ou passou de 45 minutos; os passos seguintes rodaram com o que já estava no banco."
          exit 1

      - name: Conferir a busca por termo
        if: always() && steps.termos.outcome == 'failure'
        run: |
          echo "::error::A busca por termo falhou em todas as plataformas; o resto da varredura rodou."
          exit 1
