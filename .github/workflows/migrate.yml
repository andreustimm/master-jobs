# Produção única. Execução humana explícita; nunca compete com deploy por push.
# No corte inicial, aplique a migration revisada pela CLI ANTES da promoção.
name: Migrações

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Confirme o ref do projeto Supabase master-jobs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-supabase-production
  cancel-in-progress: false

jobs:
  migrar:
    if: github.ref == 'refs/heads/main' && inputs.confirm_project == 'bujawvnxwtmneiggizje'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrar produção e conferir integridade
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
          DATABASE_CA_CERT: config/certs/supabase-ca.crt
        run: ./.github/scripts/migrar.sh
