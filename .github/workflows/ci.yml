# Portão de qualidade.
#
# Roda no PR e no push das três branches que viram ambiente. O deploy em si é da
# integração Git da Vercel, que dispara no push — este arquivo NÃO implanta. A
# consequência importante: sem proteção de branch, a Vercel implanta mesmo com
# este workflow vermelho. Ver docs/engineering/deploy.md, seção "O portão".
#
# Os gates rodam em jobs paralelos, e `qualidade` é o agregador: ele só passa
# quando TODOS os outros jobs passaram. É esse nome que a promoção
# (`scripts/release/promotion-ci.ts`) e a proteção de branch exigem, então um
# job novo neste arquivo precisa entrar em `qualidade.needs` — o teste
# `tests/ci-pipeline.test.ts` reprova quem esquecer.
name: CI

on:
  workflow_call:
    inputs:
      target-sha:
        required: true
        type: string
    outputs:
      validated-sha:
        value: ${{ jobs.validacao.outputs.sha }}
  pull_request:
  push:
    branches: [main, staging, dev]
  # A PR `staging → main` é aberta pelo robô, e push ou PR do `GITHUB_TOKEN`
  # não dispara workflow; `workflow_dispatch` é a exceção. A promoção o usa
  # para publicar `qualidade` e `schema-e-migracao` na cabeça de `staging`,
  # com os nomes que o ruleset de `main` exige. Sem entradas: roda como push,
  # menos o `e2e-navegador` (ver o job).
  workflow_dispatch:

# Um PR que recebe três pushes seguidos não precisa de três execuções: só a
# última diz alguma coisa. As anteriores são canceladas.
concurrency:
  # A validação de release não disputa/cancela o CI de pushes posteriores.
  group: ci-${{ inputs.target-sha || github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    # Os gates curtos que não dependem de teste: changelogs, tracker de QA,
    # tipos e os contratos das skills de QA. Juntos custam menos que a
    # preparação de um runner, por isso dividem um.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false
          # O validador de changelogs lê os assuntos desde a última tag. Num
          # clone raso não há tag nenhuma, e a leva parece vazia.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # A versão vem de `engines` no package.json, e não de um número
          # repetido aqui: duas fontes divergem, e a que quebra é sempre a que
          # ninguém lembrou de atualizar.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changelogs prontos para release
        # O hook local bloqueia commits releaseáveis com changelogs incompletos;
        # este gate cobre commits feitos sem hooks e integrações remotas. A
        # validação usa a mesma função pura do versionamento e falha antes de a
        # promoção tocar em `staging`.
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/release-commit-message"
          pnpm check:release-ready \
            --commit-message-file "$RUNNER_TEMP/release-commit-message"

      - name: Fonte canônica das instruções
        # Symlinks dos harnesses (cópia vira segunda autoridade), links, âncoras
        # e IDs de regra da entrada, das regras e das skills. Não julga o texto
        # das regras: só garante que cada ponteiro chega aonde diz chegar.
        run: pnpm check:instructions

      - name: Tracker de QA conforme o esquema
        # `docs/qa/state.csv` é visão gerada e ignorada pelo git, então o
        # esquema dos cenários só era conferido quando alguém rodava o
        # validador de propósito. Quando alguém rodou, em 2026-09-21, achou 15
        # registros inválidos em 15 arquivos, alguns de semanas antes. Custa
        # menos de um segundo, e registro fora do esquema passa a reprovar
        # aqui, no mesmo portão do `pnpm check` local.
        run: pnpm check:qa-tracker

      - name: Tipos
        run: pnpm typecheck

      - name: Contratos das skills de QA
        run: pnpm test:qa-skills

  testes:
    # A suíte em quatro fatias, cada uma num runner próprio. Cada runner sobe o
    # seu PostgreSQL em Docker (`tests/support/postgres-global.ts`) e tem o seu
    # disco, então as fatias não disputam banco, porta nem arquivo temporário.
    #
    # A cobertura de uma fatia é parcial e não diz nada sozinha: os limiares
    # ficam zerados aqui e são aplicados sobre o total, no job `cobertura`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Uma fatia vermelha não cancela as outras: a lista completa de falhas
      # vale mais que os segundos economizados.
      fail-fast: false
      matrix:
        fatia: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false
          # O teste de precisão histórica distingue tags leves de anotadas.
          # Sem as refs, um clone raso parece não ter evidência nenhuma e o
          # contrato passa localmente, mas falha no runner limpo.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gerar o changelog compilado
        # `src/generated/changelog.ts` não é versionado. No job único ele vinha
        # de carona no `pretypecheck`; aqui não há typecheck antes, e os testes
        # que o importam precisam dele.
        run: pnpm changelog:build

      - name: Gerar o service worker
        # ANTES dos testes, e a ordem não é estética.
        #
        # `public/sw.js` é derivado de `scripts/sw-template.js` e está no
        # .gitignore, então um checkout limpo não o tem. `tests/pwa.test.ts`
        # afirma que o arquivo existe e carrega a marca de versão — é o teste
        # que garante que nenhum deploy sirva um service worker com o
        # placeholder literal dentro. Rodar os testes antes desta etapa faz esse
        # caso falhar em toda execução do CI, por ausência do arquivo e não por
        # defeito. Na máquina de quem desenvolve ele passa, porque já houve um
        # build antes — que é justamente como essa divergência se esconde.
        run: node scripts/sw-version.mjs

      - name: Testes (fatia ${{ matrix.fatia }} de 4)
        run: >-
          pnpm vitest run --shard=${{ matrix.fatia }}/4 --coverage --reporter=blob
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - uses: actions/upload-artifact@v7
        # Também quando a fatia falha: o relatório mesclado é o lugar mais
        # legível para ver quais testes quebraram.
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.fatia }}
          path: .vitest-reports/*
          # `.vitest-reports` começa com ponto, e o upload ignora arquivo
          # oculto por padrão — sem isto o artefato sobe vazio.
          include-hidden-files: true
          if-no-files-found: error
          # "Re-run failed jobs" reaproveita as fatias verdes e refaz só a
          # vermelha, no mesmo run: sem sobrescrever, o upload da fatia refeita
          # colide com o artefato da tentativa anterior e reprova por nome.
          overwrite: true
          # Os blobs das fatias verdes precisam sobreviver até esse re-run: se
          # expirarem antes, `cobertura` mescla só a fatia refeita e reprova o
          # piso num commit cujos testes passaram todos. Sete dias cobrem um
          # re-run tardio sem guardar artefato indefinidamente.
          retention-days: 7

  cobertura:
    # Junta as quatro fatias e aplica os limiares de `vitest.config.ts` sobre o
    # TOTAL — é o mesmo piso global do `pnpm check` local, medido sobre a suíte
    # inteira. Os números moram no config: um número repetido aqui só informa
    # enquanto ninguém mexe no primeiro, e depois desinforma.
    #
    # Roda também quando uma fatia falhou (`!cancelled()`): sem isso ele seria
    # pulado, e o relatório mesclado — que lista as falhas de todas as fatias
    # num lugar só — nunca apareceria justo quando é útil. O veredito não muda:
    # `qualidade` reprova pela fatia vermelha de qualquer jeito.
    if: ${{ !cancelled() }}
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Cobertura total contra os limiares
        # Reprova também se alguma fatia registrou teste falho: a mesclagem
        # repete o resultado de cada um.
        run: pnpm vitest run --merge-reports --coverage

  pwa-browser:
    # O contrato de privacidade abre um Chromium real. Ele fica separado da
    # cobertura para não concorrer com os testes curtos, mas continua sendo
    # obrigatório no mesmo portão que autoriza a promoção.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preparar os artefatos gerados
        # Os mesmos que os testes curtos exigem: o service worker (pelo motivo
        # do comentário no job `testes`) e o changelog compilado.
        run: |
          pnpm changelog:build
          node scripts/sw-version.mjs

      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        # O Chromium pinado só muda quando o Playwright muda; baixá-lo em toda
        # execução custava mais que o próprio teste. As dependências do sistema
        # continuam vindo do `--with-deps`, que não fica em cache.
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      - name: Instalar Chromium do gate PWA
        run: pnpm exec playwright install --with-deps chromium

      - name: Fronteira PWA em navegador real
        run: pnpm test:pwa-browser

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        # Cache incremental do webpack. A chave exata casa só com o mesmo
        # código; a de restauração reaproveita o último build com as mesmas
        # dependências, que é onde está quase todo o ganho.
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'src/**', 'components/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        # `prebuild` gera o service worker e o changelog compilado.
        run: pnpm build

  schema-e-migracao:
    # Separado do portão de qualidade porque responde outra pergunta: não é "o
    # código funciona", é "o banco acompanha o código". Um schema.ts alterado
    # sem migração correspondente passa em todos os testes — eles rodam sobre um
    # banco recriado do zero — e quebra só no ambiente que já tem dado.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Schema e migrações estão em sincronia
        # `drizzle-kit generate` só escreve arquivo quando encontra diferença
        # entre o schema e as migrações. Se a árvore ficar suja depois de rodar,
        # é porque alguém mexeu no schema e não gerou a migração.
        run: |
          pnpm drizzle-kit generate --name ci_verificacao_de_sincronia
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::schema.ts mudou sem migração correspondente."
            echo "Rode: pnpm db:generate --name <descricao> e comite o resultado."
            git status --porcelain drizzle/
            exit 1
          fi
          echo "Schema e migrações em sincronia."

  e2e-navegador:
    # A suíte `pnpm test:e2e` inteira — interface, papéis, 320–1024 px, inglês,
    # temas e axe WCAG 2.2 AA — num navegador real, sobre build de produção e
    # autenticação real. Até aqui ela só rodava na máquina de quem lembrava, e
    # o CI via apenas o Vitest e a fronteira da PWA.
    #
    # Job próprio, sem `needs`, e fora de `qualidade.needs`: é a única exceção
    # registrada ao agregador (`NON_BLOCKING_JOBS` em tests/support/ci-workflow.ts).
    #
    # Banco: o próprio `run-isolated.mjs` sobe um `postgres:17` descartável pelo
    # Docker do runner, preso a 127.0.0.1, com senha aleatória — o mesmo
    # caminho da máquina local. Um `services:` do Actions seria um segundo
    # caminho, que o harness não usa e que poderia divergir do primeiro; e
    # `tests/e2e/database-guard.mjs` recusa qualquer banco fora do loopback.
    #
    # Nenhum `secrets.*` aqui: a suíte não precisa de credencial nenhuma, e um
    # PR de qualquer branch roda este job.
    #
    # Fora do agregador e da proteção de branch de propósito, até a
    # instabilidade estar medida (issue #202). Na chamada da promoção ele nem
    # roda: um job vermelho ali reprovaria a promoção inteira, e isso é tornar
    # o E2E obrigatório por outra porta. Nem no `workflow_dispatch` que a
    # promoção dispara em `staging`: ali só interessam os checks que o ruleset
    # de `main` exige, e 15 minutos de navegador só atrasam a PR de produção
    # (#303). `staging` recebe exatamente o SHA cujo push em `dev` já rodou o E2E.
    if: github.event_name != 'workflow_dispatch' && inputs.target-sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Versão do Playwright
        id: playwright
        # A chave do cache é a versão instalada, não o lockfile inteiro: trocar
        # qualquer outra dependência não deve baixar os navegadores de novo.
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores do Playwright
        id: cache-navegadores
        # Restauração e gravação separadas: o `actions/cache` inteiro só grava
        # quando o job termina verde, e enquanto a suíte reprovar cada execução
        # baixaria os navegadores de novo.
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Instalar Chromium e WebKit
        # `ui.mjs` abre o WebKit para o histórico de novidades no Safari.
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Guardar os navegadores no cache
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-navegadores.outputs.cache-primary-key }}

      - name: Dependências de sistema dos navegadores
        # O cache guarda os binários, não as bibliotecas do apt.
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: E2E hermético (UI + axe)
        run: pnpm test:e2e

  qualidade:
    # O agregador. `always()` é obrigatório, e não enfeite: sem ele, um job
    # anterior vermelho faz este ser PULADO, e a proteção de branch trata check
    # obrigatório pulado como aprovado. Com ele, o job roda sempre e reprova
    # por conta própria quando qualquer dependência não terminou em sucesso —
    # falha, pulo ou cancelamento.
    if: ${{ always() }}
    needs: [contratos, testes, cobertura, pwa-browser, build, schema-e-migracao]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Todos os gates passaram
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTADOS" | jq -e 'length > 0 and (to_entries | all(.value.result == "success"))' > /dev/null

  validacao:
    if: inputs.target-sha != ''
    needs: [qualidade, schema-e-migracao]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.alvo.outputs.sha }}
    steps:
      - id: alvo
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
        run: echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
