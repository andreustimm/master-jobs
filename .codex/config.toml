# Configuração do Codex para o master-jobs — camada de projeto.
#
# O Codex só carrega `.codex/` (este arquivo, agentes, hooks) quando o projeto
# está marcado como confiável no seu `~/.codex/config.toml`. Sem isso, a guarda
# de permissões abaixo NÃO roda.
#
# Instruções: `AGENTS.md` na raiz, descoberto sozinho pelo Codex — a única
# fonte autoral; `CLAUDE.md` é symlink para ela. Detalhe das regras em
# `docs/engineering/rules/`. Este arquivo liga o harness; não redefine
# política (G72). Paridade com Claude Code e OpenCode: G85.
#
# - Skills: `.agents/skills` → `.claude/skills` (symlink).
# - Agentes: `.codex/agents/*.toml`, gerados de `.claude/agents/` por
#   `pnpm harness:sync`. Não edite os .toml.
# - Permissões: `.codex/hooks.json` (gerado) chama
#   `scripts/harness/codex-guard.ts`, que aplica a lista de
#   `.claude/settings.json` a cada comando e patch. `ask` vira bloqueio, porque
#   o hook do Codex não sabe perguntar.
# - Comandos (`.claude/commands/`): o Codex não tem comando de projeto (custom
#   prompts são pessoais e obsoletos). Peça "rode o /vagas" e leia o arquivo.
#
# Todo comando de shell no Codex vai prefixado com `rtk` (G63). Os de uso
# diário: `rtk pnpm install`, `rtk pnpm check`, `rtk pnpm jho jobs sync`,
# `rtk pnpm jho jobs list --min-fit 55`, `rtk pnpm jho pipeline`.

[features]
# Ligado por padrão no Codex; explícito porque a guarda depende dele.
hooks = true
