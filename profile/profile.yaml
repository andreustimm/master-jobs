  contract_models: [b2b, contractor, cnpj, freelance, full-time-remote]
  remote_only: true
  # Regions that reliably hire remote contractors from Brazil.
  acceptable_regions: [worldwide, global, latam, americas, brazil, remote]
  max_timezone_offset_hours: 6

