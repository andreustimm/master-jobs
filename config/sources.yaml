# ---------------------------------------------------------------------------
# Job sources.
#
# Every entry is a public, unauthenticated endpoint. Nothing here scrapes a
# logged-in session — see docs/linkedin-policy.md for why that boundary exists.
#
# `handle` meaning by kind:
#   greenhouse       board token in boards-api.greenhouse.io/v1/boards/<token>
#   lever            company slug in api.lever.co/v0/postings/<slug>
#   ashby            board name in jobs.ashbyhq.com/<board>
#   smartrecruiters  company identifier
#   recruitee        subdomain in <handle>.recruitee.com
#   himalayas        optional free-text query ("" = everything recent)
#   remotive         optional search term
#   arbeitnow        ignored (whole board)
#   remoteok         ignored (whole board)
#   adzuna           "<country>:<query>", requires ADZUNA_APP_ID/KEY
#
# Verify a handle before adding it:  pnpm jho sources probe <kind> <handle>
# ---------------------------------------------------------------------------

sources:
  # --- Tier 1: companies already confirmed to hire remotely from Brazil -----
  # Source: LinkedIn/vagas_agosto_2026.md (BairesDev client mapping, Aug 2026)
  - kind: greenhouse
    handle: stackblitz
    label: Bolt (StackBlitz)
    rationale: "Tier 1 — global remote, Staff/Senior Applied AI Engineer roles open"

  # --- Companies from the July 2026 job benchmark (audit §7.2) --------------
  - kind: ashby
    handle: textlayer
    label: TextLayer
    rationale: "Benchmark — Staff AI Architect, agent architecture + multi-tenant"
  - kind: ashby
    handle: paires
    label: Paires
    rationale: "Benchmark — Applied AI Engineer, explicitly open to Brazil"
  - kind: ashby
    handle: reflow
    label: Reflow
    rationale: "Benchmark — AI Engineer, remote across Canada/Europe/LatAm/US"
  - kind: ashby
    handle: g2i
    label: G2i
    rationale: "Benchmark — Senior/Staff AI Engineer, remote contract"
  - kind: ashby
    handle: redcan
    label: Redcan
    rationale: "Benchmark — Staff Software Engineer, Agentic AI Products"
  - kind: lever
    handle: jobgether
    label: Jobgether
    rationale: "Benchmark — AI Solutions Architect, remote contract aggregator"

  # --- Marketplace com elegibilidade estruturada ---------------------------
  - kind: braintrust
    handle: "150"
    label: Braintrust
    rationale: >-
      Único marketplace encontrado com API pública aberta E país de
      elegibilidade em campo estruturado (locations[].country), em vez de
      prosa. Contratos freelance/hourly já em USD. Para um candidato cuja
      restrição mais dura é autorização de trabalho, é a fonte de maior
      densidade de sinal do acervo.

  # --- Vitrine de outsourcing com board público ------------------------------
  - kind: greenhouse
    handle: turing
    label: Turing
    rationale: >-
      Das treze vitrines de outsourcing sondadas em 2026-09-20 (Revelo,
      BairesDev, WillDom, Strider, VanHack, TECLA, Jobsity, BEON, Howdy,
      Nearsure, Talently, Index.dev, Turing), a Turing é a única com board
      público que já sabemos ler: Greenhouse, 21 vagas. Ressalva honesta — são
      as vagas do time INTERNO da Turing, não os contratos do marketplace, e a
      maioria é presencial nos EUA, que o scorer bloqueia por elegibilidade.
      Entra porque nomeia o empregador, custa uma chamada por varredura e
      ocasionalmente abre posição no Brasil. As outras doze não têm listagem
      pública: a via delas é a vitrine, não a ingestão —
      ver docs/sources-autenticadas.md.

  # --- Broad remote aggregators --------------------------------------------
  # These widen the funnel beyond known companies. Noisy by design; the scorer
  # filters, not the fetcher.
  - kind: himalayas
    handle: "60"
    label: Himalayas (recentes)
    rationale: >-
      101.022 vagas no board, servidas 20 por requisição e ordenadas por data.
      60 páginas = as ~1.200 vagas mais recentes, que é onde a taxa de resposta
      é maior. O handle é a contagem de páginas, não um termo de busca — a API
      aceita `q` e o ignora.
  - kind: remotive
    handle: "architect"
    label: Remotive (architect)
    rationale: "Free API, filtered to architecture-flavoured roles"
  - kind: remotive
    handle: "ai engineer"
    label: Remotive (AI engineer)
    rationale: "Second pass on the AI cluster"
  - kind: arbeitnow
    handle: ""
    label: Arbeitnow
    rationale: "Free API aggregating ATS boards, mostly EU — useful for EU B2B"
  - kind: remoteok
    handle: ""
    label: RemoteOK
    rationale: "Free API, worldwide remote, salary data on many postings"
  - kind: jobicy
    handle: latam
    label: Jobicy
    rationale: >-
      API documentada e sem chave. `latam` traz as vagas abertas à América
      Latina e as "Anywhere"; `jobGeo` diz quem pode se candidatar e bloqueia
      a vaga restrita a outro país. 100 vagas em 2026-09-19.
  - kind: workable
    handle: software
    label: Workable (software)
    rationale: >-
      Busca global da Workable, só vagas remotas com local Brasil e empresa
      nomeada. 242 resultados em 2026-09-19; o feed lê as 5 primeiras páginas.
  - kind: workable
    handle: developer
    label: Workable (developer)
    rationale: "Segunda passada na busca global da Workable: 123 resultados em 2026-09-19"
  - kind: hackernews
    handle: who-is-hiring
    label: Hacker News (Who is hiring)
    rationale: >-
      Fio mensal escrito pelas próprias empresas, empresa sempre nomeada. 235
      vagas no fio de setembro de 2026. O handle não é lido: é sempre o fio do mês.

