  # api.lever.co/v0/postings/<handle>. Ficaram de fora: Bluelight Consulting
  # (1.321 postagens repetindo 10 cargos, uma por cidade — a cidade entra na
  # identidade da vaga, então viravam 1.321 vagas; ela já chega pela
  # Himalayas e pelo RemoteOK) e três com elegibilidade incerta para o Brasil
  # (Canary Technologies, Mutt Data, CSC Generation).
