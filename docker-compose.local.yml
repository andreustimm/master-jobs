name: master-jobs-local

services:
  db:
    # A versão mais nova da distribuição Supabase (política de versões, issue
    # #468): o Renovate sobe esta tag por PR. A major é a chave `local` de
    # config/postgres-majors.json, e `pnpm check:versions` reprova se as duas
    # divergirem. A tag é fixa para que a instalação das extensões seja
    # reproduzível; a produção (Supabase gerenciado) sobe por ação do dono no
    # painel.
    image: ${LOCAL_POSTGRES_IMAGE:-supabase/postgres:17.11.0.004}
    container_name: master-jobs-local-supabase-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      # Supabase's image uses this superuser for extension initialization.
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-master_jobs_local_only}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-master_jobs_local}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - master_jobs_local_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/verify.sql:/docker/verify.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # Armazenamento de objetos local para o adapter S3 (#327, ADR 0029). A
  # imagem oficial `minio/minio` saiu do Docker Hub; `pgsty/minio` é o fork
  # comunitário mantido, com o mesmo binário `minio` e o cliente `mc`. Fixada
  # por DIGEST, além da tag: a tag de um fork pode ser republicada, o digest
  # não (ADR 0029 registra a escolha e as alternativas).
  # Portas SÓ em 127.0.0.1 (regra 12): a foto de perfil privada não pode
  # ficar alcançável pela rede local. Credenciais só de desenvolvimento.
  minio:
    image: ${LOCAL_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: master-jobs-local-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_USER:-master_jobs_local}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:-master_jobs_local_only}
    ports:
      - "127.0.0.1:${LOCAL_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - master_jobs_local_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # Cria o bucket uma vez e sai. `--ignore-existing` torna o bootstrap
  # idempotente: `docker compose up` de novo não falha nem apaga nada.
  minio-init:
    image: ${LOCAL_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: master-jobs-local-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_USER:-master_jobs_local}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:-master_jobs_local_only}
      LOCAL_MINIO_BUCKET: ${LOCAL_MINIO_BUCKET:-master-jobs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing "local/$${LOCAL_MINIO_BUCKET}"

volumes:
  master_jobs_local_pgdata:
  master_jobs_local_minio:
